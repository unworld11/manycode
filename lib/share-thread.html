<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manycode · Shared conversation</title>
<style>body{margin:0;background:#151816;color:#ecf2ed;font:16px system-ui}main{max-width:860px;margin:auto;padding:24px}header{display:flex;align-items:center;gap:16px;border-bottom:1px solid #38453b}h1{font-size:22px}#status{color:#a9beb0}article{padding:16px;border:1px solid #38453b;border-radius:12px;margin:14px 0;white-space:pre-wrap;overflow-wrap:anywhere}article[data-role=user]{background:#25362b}article[data-role=tool]{font-size:13px;color:#b5c3b9}b{display:block;font-size:12px;margin-bottom:8px;text-transform:uppercase;color:#91d9a5}form{position:sticky;bottom:0;background:#151816;padding:16px 0}textarea{width:100%;box-sizing:border-box;background:#222923;color:white;border:1px solid #58725f;border-radius:10px;padding:14px;font:inherit;min-height:85px}button{background:#94e5ad;border:0;border-radius:8px;padding:12px 20px;margin-top:8px;font:inherit}button:disabled{opacity:.5}#notice{color:#bccbbf;font-size:14px}</style>
<main><header><h1 id="title">Shared conversation</h1><span id="status">Connecting…</span></header><p id="notice">Only the host-selected chat is shared. Tool approvals stay with the host.</p><section id="messages" aria-live="polite"></section><form id="composer"><textarea id="prompt" maxlength="16000" aria-label="Prompt in shared chat" placeholder="Prompt in this conversation…" required></textarea><button id="send">Send prompt</button><p id="delivery" role="status"></p></form></main><script src="/client.js"></script></html>
